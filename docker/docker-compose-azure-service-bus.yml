services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: container-30092026-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SenhaForte123!"
    ports:
      - "1433:1433"
    volumes:
      - volume-30092026-sql:/var/opt/mssql
    networks:
      - network-30092026          

  # 1. Emulador do Azure Service Bus (Local via Docker)     
  service-bus-emulator:    
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: container-30092026-service-bus-emulator
    pull_policy: always
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: "sqlserver"
      MSSQL_SA_PASSWORD: "SenhaForte123!"
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      # Certifique-se de que este arquivo existe na pasta do seu projeto se for utilizá-lo
      - ./config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      - sqlserver
    networks:
      - network-30092026
      
  api-cliente:
    build:
      context: ..
      dockerfile: ./api_cliente/Dockerfile    
    image: image-30092026-api-cliente:latest
    container_name: container-30092026-api-cliente
    ports:
      - "1000:8080"
    networks:
      - network-30092026  

  api-produto:
    build:
      context: ..
      dockerfile: ./api_produto/Dockerfile    
    image: image-30092026-api-produto:latest
    container_name: container-30092026-api-produto
    ports:
      - "1001:8080"
    networks:
      - network-30092026  
      
  api-cartao:
    build:
      context: ..
      dockerfile: ./api_cartao/Dockerfile    
    image: image-30092026-api-cartao:latest
    container_name: container-30092026-api-cartao
    ports:
      - "1002:8080"
    networks:
      - network-30092026  
    
  api-pedido:
    build:
      context: ..
      dockerfile: ./api_pedido/Dockerfile
    image: image-30092026-api-pedido:latest
    container_name: container-30092026-api-pedido
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__conexao=Server=sqlserver,1433;Database=db_pedido;User Id=sa;Password=SenhaForte123!;TrustServerCertificate=true;      
      - AzureServiceBusConnectionString=Endpoint=sb://service-bus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    ports:
      - "1003:8080"
    depends_on:
      - sqlserver
      - service-bus-emulator
    networks:
      - network-30092026     

  fn-estoque-queue:
    build:
      context: ..
      dockerfile: ./fn_estoque_queue/Dockerfile
    image: image-30092026-fn-estoque-queue:latest
    container_name: container-30092026-fn-estoque-queue
    environment:
      - AzureWebJobsStorage=UseDevelopmentStorage=true
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - url_api_produto=http://api-produto:8080/api/produtos/verificar
      - url_api_pedido=http://api-pedido:8080/api/pedidos
      - AzureServiceBusConnectionString=Endpoint=sb://service-bus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    ports:
      - "7071:8080" 
    depends_on:
      - service-bus-emulator      
      - api-produto
      - api-pedido
    networks:
      - network-30092026
      
  fn-pagamento-queue:
    build:
      context: ..
      dockerfile: ./fn_pagamento_queue/Dockerfile
    image: image-30092026-fn-pagamento-queue:latest
    container_name: container-30092026-fn-pagamento-queue
    environment:
      - AzureWebJobsStorage=UseDevelopmentStorage=true
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - url_api_cartao=http://api-cartao:8080/api/cartao/consultar
      - url_api_pedido=http://api-pedido:8080/api/pedidos
      - AzureServiceBusConnectionString=Endpoint=sb://service-bus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    ports:
      - "7072:8080" 
    depends_on:
      - service-bus-emulator      
      - api-cartao
      - api-pedido
    networks:
      - network-30092026
      
volumes:
  volume-30092026-sql:
    driver: local

networks:
  network-30092026:
    driver: bridge